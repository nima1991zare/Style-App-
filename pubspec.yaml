name: aura_stylist
description: "Aura Stylist - personal stylist camera: rate outfits, get color & body-type advice, and discover combos from your own wardrobe. Runs fully on-device."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  camera: ^0.12.0+2
  camera_windows: ^0.2.6+4
  flutter:
    sdk: flutter
  google_fonts: ^8.2.0
  image: ^4.9.1
  image_picker: ^1.2.3
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
